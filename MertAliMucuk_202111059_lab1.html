<!--NOT1:başta durağan olan logom ve arka fon gifim logine bastığınız zaman animasyonlu olarak çalışacak hocam.-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mcqueen Login</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 142vh;
        background: url("https://i.pinimg.com/736x/97/1e/5a/971e5a4600d5c749668194840c1154fa.jpg")
          no-repeat center center fixed;
        background-size: cover;
        overflow: hidden;
      }
      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .logo-container {
        width: 150px;
        height: 150px;
        background: black;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
      }
      .small-logo {
        width: 40px;
        height: 30px;
        position: absolute;
        top: -10px;
        left: 50%;
        transform: translateX(-50%);
      }

      .trophy {
        position: relative;
        width: 80px;
        height: 120px;
      }

      .cup {
        width: 80px;
        height: 60px;
        background: gold;
        border-radius: 40px 40px 0 0;
        position: absolute;
        top: 0;
      }

      .handles {
        position: absolute;
        width: 110px;
        height: 50px;
        border: 8px solid gold;
        border-radius: 50%;
        top: 5px;
        left: -20px;
      }

      .stem {
        width: 30px;
        height: 30px;
        background: gold;
        position: absolute;
        top: 60px;
        left: 25px;
      }

      .base {
        width: 50px;
        height: 15px;
        background: darkgoldenrod;
        position: absolute;
        top: 90px;
        left: 15px;
      }

      .small-logo .handles {
        width: 60px;
        height: 30px;
        border-width: 5px;
        left: 0px;
      }
      .small-logo .cup {
        width: 50px;
        height: 30px;
        border-radius: 25px 25px 0 0;
        left: 10px;
        top: 40;
      }
      .small-logo .stem {
        width: 15px;
        height: 30px;
        left: 28px;
        top: 30px;
      }
      .small-logo .base {
        width: 30px;
        height: 10px;
        left: 20px;
        top: 50px;
      }

      .login-box {
        position: relative;
        padding: 10px;
        background: white;
        border-radius: 20px;
        border: 6px solid red;
        box-shadow: 0 0 10px rgba(255, 0, 0, 0.3);
        margin-top: 20px; /* Logo ile araya mesafe eklemek için */
        left: 5px;
        text-align: center;
      }

      input {
        width: 250px;
        padding: 10px;
        margin: 10px 0;
        border: 2px solid #ff0000; /* Kırmızı çerçeve */
        border-radius: 8px; /* Köşeleri yuvarlatma */
        font-size: 16px;
        outline: none;

        /* AI PROMPT1:HTML ve CSS ile oluşturduğum bir çerçevede yer alan yazının arkasına kırmızı tonlarında hafif bir gölge efekti nasıl ekleyebilirim? */
        transition: all 0.3s ease-in-out;
        box-shadow: 2px 2px 10px rgba(255, 0, 0, 0.3);
      }
      /*AI PROMPT2:Bir form elemanına odaklanıldığında, kenar rengi koyu kırmızıya dönsün ve etrafında kırmızımsı bir gölge oluşsun. Gölge biraz bulanık ve saydam olmalı. */
      input:focus {
        border-color: #b30000; /* Daha koyu kırmızı */
        box-shadow: 2px 2px 15px rgba(255, 0, 0, 0.5);
      }
      input::placeholder {
        color: red;
        font-weight: bold;
        font-size: 18px;
        font-family: "Arial", sans-serif;
        text-shadow: 1px 1px 5px rgba(255, 0, 0, 0.7);
        transition: all 0.3s ease;
      }
      /*AI prompt2 sonu*/

      button {
        padding: 10px 20px;
        border: none;
        background-color: red;
        color: white;
        cursor: pointer;
        border-radius: 5px;
        font-size: 16px;
      }

      h2 {
        color: red;
        font-size: 22px;
      }
      /*AI PROMPT3:Bir öğeye 360 derece dönen bir animasyon ve bir arka plan hareketi ekleyen CSS kodu yaz */
      .rotate {
        animation: rotate 2s linear 1; /*bu kısmı kendim ayarladım*/
      }
      /*AI PROMPT4:Arka fonda oynayan bir animasyonun yukarıdan aşağıya hareketini nasıl sağlarım css ile */
      @keyframes rotate {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      /*AI PROMPT4 sonu */
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo-container">
        <div class="logo trophy" id="main-logo">
          <div class="handles"></div>
          <div class="cup"></div>
          <div class="stem"></div>
          <div class="base"></div>
        </div>
      </div>
      <div class="login-box">
        <!-- Küçük kupa logosu -->

        <p
          style="
            font-size: 20pt;
            color: red;
            font-weight: bold;
            font-family: 'Times New Roman', serif;
            text-shadow: 3px 3px 5px rgba(0, 0, 0, 0.5),
              0px 0px 10px rgba(255, 0, 0, 0.8);
          "
        >
          MCQUEEN KACOVV CLUB ENTRANCE
        </p>
        <div class="small-logo trophy" id="small-logo">
          <div class="handles"></div>
          <div class="cup"></div>
          <div class="stem"></div>
          <div class="base"></div>
        </div>
        <input type="text" placeholder="Route66 Username" />
        <input type="password" placeholder="Route66 Password" />
        <button onclick="startAnimation()">Login</button>
        <!--Kendim internetten bulup kullandım-->
      </div>
    </div>
    <!--AI PROMPT5: Bir fonksiyon yaz fonksiyon çalışınca arka fondaki gifin hareketi saglansın ve oluşturduğum logonun rotate hareketi sağlansın -->
    <script>
      function startAnimation() {
        document.getElementById("main-logo").classList.add("rotate");
        document.getElementById("small-logo").classList.add("rotate");
        document.body.style.backgroundImage =
          'url("https://i.pinimg.com/originals/2b/ad/fa/2badfaa932f37114daa074a85a75a847.gif")';
      }
    </script>

    <!--AI PROMPT5 SONU-->
  </body>
</html>
